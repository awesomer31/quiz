<title>Game Show</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{margin:0;font-size:clamp(20px,3vw,32px);letter-spacing:.04em;text-transform:uppercase}
.btns{display:flex;gap:8px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:8px 14px}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cat{background:linear-gradient(160deg,var(--cat),#1f2a7a);color:var(--cat-t);border-radius:8px;padding:14px 6px;text-align:center;font-weight:700;font-size:clamp(13px,2vw,24px);min-height:48px;display:flex;align-items:center;justify-content:center;text-transform:uppercase;overflow-wrap:anywhere}
.cat input{width:100%;font:inherit;font-weight:700;text-align:center;background:transparent;color:inherit;border:1px dashed var(--cat-t);border-radius:6px;padding:6px;text-transform:uppercase}
.tile{background:var(--tile);color:var(--tile-t);font-weight:800;font-size:clamp(16px,3.2vw,38px);border:0;border-radius:8px;aspect-ratio:16/6;padding:0}
.tile:hover{filter:brightness(1.15)}
.tile.used{background:var(--used);color:var(--used-t);cursor:default;filter:none}
.tile.used span{visibility:hidden}
.edit .tile.used{background:var(--tile);color:var(--tile-t);cursor:pointer}
.edit .tile.used span{visibility:visible}
.cams{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}
.cam{aspect-ratio:1/1;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:clamp(11px,1.6vw,18px);opacity:.75;background:linear-gradient(160deg,rgba(106,47,208,.18),rgba(194,24,91,.12))}
.tile{box-shadow:0 0 14px rgba(106,47,208,.55)}
.tile.used{box-shadow:none}
.edit .tile.used{box-shadow:0 0 14px rgba(106,47,208,.55)}
.pill{background:linear-gradient(90deg,var(--accent),var(--tile));color:#fff;font-weight:800;border-radius:999px;padding:10px 22px;text-transform:uppercase;letter-spacing:.04em;box-shadow:0 0 16px rgba(194,24,91,.45)}
.pill::before{content:"\2605  "}.pill::after{content:"  \2605"}
.buzzwrap{display:flex;justify-content:center;margin-top:14px}
.buzz{width:120px;height:120px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;letter-spacing:.06em;font-size:14px;background:var(--card);color:var(--text);border:2px solid var(--line)}
.buzz.hit{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 28px var(--accent)}
.cam{position:relative;cursor:pointer;overflow:hidden}
.cam.active{border-style:solid;border-color:var(--accent);opacity:1;box-shadow:0 0 18px var(--accent)}
.badge{position:absolute;top:6px;left:6px;background:var(--tile);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800}
.badge.neg{background:#c2185b}
.badge input{width:70px;font:inherit;background:transparent;color:#fff;border:0;border-bottom:1px dashed #fff}
.pname{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:86%;box-sizing:border-box;background:var(--cat);color:#fff;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.pname input{width:100%;font:inherit;text-transform:uppercase;background:transparent;color:#fff;border:0;text-align:center}
dialog{border:0;border-radius:14px;background:var(--card);color:var(--text);width:min(760px,92vw);padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.meta{color:var(--accent);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.q{font-size:clamp(20px,4vw,34px);font-weight:700;margin:14px 0;min-height:60px}
.a{font-size:clamp(18px,3.4vw,28px);color:var(--accent);font-weight:700;margin:10px 0;min-height:36px}
textarea{width:100%;box-sizing:border-box;font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;margin:4px 0 12px}
label{font-size:13px;opacity:.8}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
dialog{background:linear-gradient(180deg,#3b1a7a,#1c2468);color:#fff;border:1px solid #5aa9ff;border-radius:12px;padding:0;width:min(1000px,94vw);box-shadow:0 0 40px rgba(90,169,255,.45),inset 0 0 30px rgba(90,169,255,.12)}
.dh{padding:16px;text-align:center;font-weight:800;font-size:clamp(16px,2.4vw,26px);color:#5ab4ff;text-transform:uppercase;border-bottom:1px solid rgba(90,169,255,.35);text-shadow:0 0 12px rgba(90,169,255,.6)}
.db{padding:26px 24px}
.dq{text-align:center;font-weight:800;font-size:clamp(22px,3.8vw,44px);text-transform:uppercase;line-height:1.2}
.dans{text-align:center;margin-top:18px;font-weight:800;font-size:clamp(20px,3.4vw,38px);text-transform:uppercase;color:#ffd1e6;text-shadow:0 0 16px var(--accent);animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.db>div:has(.dturn){text-align:center}
.dturn{display:inline-block;margin-top:18px;padding:6px 16px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(90,169,255,.3);font-size:15px;text-transform:uppercase}
.dhost{text-align:center;margin-top:14px;font-size:14px;opacity:.65}
.dbtn{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.tile{font-style:italic}
.pname{background:linear-gradient(180deg,#c2185b,#7a0f3a)}
.cam.active .pname{box-shadow:0 0 12px var(--accent)}
.adj{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.adj button{padding:8px 0;font-weight:800;font-size:14px}
.adj button.neg{color:#ff6b8f}
#adj{margin-bottom:-6px}
body.aud #adj{display:none}
.buzz:disabled{opacity:.4;cursor:default}
.adj .turnbtn{grid-column:span 3}
.adj .kickbtn{grid-column:span 1;color:#ff9db6}
.adj .turnbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cams{grid-template-columns:repeat(4,minmax(0,1fr))}
.cam{aspect-ratio:auto;height:84px;border:2px solid var(--line);opacity:1}
.pname{top:50%;bottom:auto;transform:translate(-50%,-50%);font-size:clamp(14px,2vw,22px);padding:8px 12px}
body.aud .hostonly{display:none}
body.aud .tile,body.aud .cam,body.aud .buzz{cursor:default}
#join{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50}
.jbox{display:flex;flex-direction:column;gap:10px;width:min(340px,90vw);background:var(--card);padding:24px;border-radius:14px;border:1px solid var(--line)}
.jbox input{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);text-transform:uppercase}
.jbox h2{margin:0}
#cams,#adj{display:flex;justify-content:center;gap:8px}
#cams>*,#adj>*{flex:none;width:calc((100% - 24px)/4)}
body{padding:8px}
header{margin-bottom:6px}
h1{font-size:clamp(16px,2.6vh,24px)}
button{padding:5px 10px;font-size:13px}
.pill{padding:5px 14px;font-size:13px}
.board{gap:5px}
.cat{min-height:0;padding:6px;font-size:clamp(11px,1.9vh,18px)}
.tile{aspect-ratio:auto;height:clamp(32px,6.5vh,64px);font-size:clamp(14px,2.8vh,30px)}
.buzzwrap{margin-top:6px}
.buzz{width:64px;height:64px;font-size:11px;gap:0}
.buzz b{font-size:24px!important}
.cams,#adj{margin-top:6px}
.cam{height:clamp(40px,7vh,64px)}
.pname{font-size:clamp(12px,1.9vh,18px);padding:4px 10px}
.adj{grid-template-columns:repeat(4,1fr);gap:3px}
.adj button{padding:4px 0;font-size:12px}
#adj{margin-bottom:0}
/* Layout v2 */
body{background:radial-gradient(ellipse at top,#2a1260 0%,#0f0922 70%) fixed;color:#fff;padding:10px 16px}
header,#board,.buzzwrap,#adj,#cams{max-width:1100px;margin-left:auto;margin-right:auto;width:100%}
header{margin-bottom:10px}
h1{font-size:clamp(15px,2.4vh,22px)}
.btns{gap:6px}
button{padding:4px 10px;font-size:12px;border-radius:7px;background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(180,150,255,.35)}
button:hover{background:rgba(255,255,255,.14)}
button.on{background:var(--accent);border-color:var(--accent)}
.pill{padding:4px 14px;font-size:12px}
.board{gap:8px}
.cat{height:46px;min-height:0;padding:4px 8px;border-radius:10px;font-size:clamp(11px,1.7vh,16px);background:linear-gradient(180deg,#8a3ae0,#4a1c92);border:1px solid rgba(190,140,255,.5);box-shadow:0 0 14px rgba(138,58,224,.45)}
.tile{height:clamp(44px,10.5vh,96px);border-radius:10px;font-size:clamp(18px,3.6vh,38px);background:linear-gradient(180deg,#6a3df0,#3a22a8);border:1px solid rgba(170,140,255,.55);box-shadow:0 0 14px rgba(106,61,240,.45)}
.tile.used{background:#150f2e;border-color:#241a4a;box-shadow:none}
.buzzwrap{margin-top:8px}
.buzz{width:56px;height:56px;border-radius:12px}
.buzz b{font-size:22px!important}
#cams,#adj{gap:8px;margin-top:8px}
.adj button{padding:3px 0;font-size:11px}
.cam{height:clamp(44px,8vh,60px);border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(180,150,255,.35)}
.cam.active{border-color:#ff4d7a;box-shadow:0 0 14px rgba(255,77,122,.55)}
.pname{font-size:clamp(12px,1.9vh,17px)}
.dimg{display:block;margin:0 auto 14px;max-height:36vh;max-width:70%;background:#fff;border-radius:12px;padding:10px}
/* v3: zentriert, Effekte, Timer */
body{box-sizing:border-box;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.tile{transition:transform .15s ease,filter .15s ease,box-shadow .15s ease}
.tile:not(.used):hover,.edit .tile.used:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 22px rgba(130,90,255,.8)}
.tile:not(.used):active{transform:scale(.97)}
.cam{transition:box-shadow .3s,border-color .3s}
.cam.active{animation:cpulse 2.2s ease-in-out infinite}
@keyframes cpulse{0%,100%{box-shadow:0 0 10px rgba(255,77,122,.4)}50%{box-shadow:0 0 22px rgba(255,77,122,.8)}}
.pname.bump{animation:bump .7s ease}
@keyframes bump{0%{transform:translate(-50%,-50%) scale(1)}35%{transform:translate(-50%,-50%) scale(1.22)}100%{transform:translate(-50%,-50%) scale(1)}}
.buzz{transition:transform .1s}
.buzz.ready{border-color:var(--accent);animation:ready 1.1s ease-in-out infinite}
.buzz.ready:active{transform:scale(.93)}
@keyframes ready{0%,100%{box-shadow:0 0 6px rgba(255,77,122,.3)}50%{box-shadow:0 0 22px rgba(255,77,122,.9)}}
.qrow{display:flex;align-items:center;justify-content:center;gap:28px}
.qrow .dq{flex:1}
.tm{position:relative;width:96px;height:96px;flex:none}
.tm.off{visibility:hidden}
.tm svg{width:100%;height:100%;display:block}
.tm .trk{fill:none;stroke:rgba(255,255,255,.15);stroke-width:8}
.tm .prg{fill:none;stroke:#5ab4ff;stroke-width:8;stroke-linecap:round;stroke-dasharray:276.46;transition:stroke-dashoffset 1s linear,stroke .3s}
.tm.low .prg{stroke:#ff4d7a}
.tm b,.tm i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal}
.tm b{font-size:36px;font-weight:800}
.tm.low b{color:#ffb3c6;animation:tp 1s ease-in-out infinite}
@keyframes tp{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.tm i{font-size:46px;opacity:0}
.tm.wait i{opacity:1;animation:wob 1s ease-in-out infinite}
.tm.wait svg,.tm.wait b{display:none}
@keyframes wob{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg) scale(1.1)}}
dialog.low{animation:alarm 1s ease-in-out infinite}
@keyframes alarm{0%,100%{box-shadow:0 0 40px rgba(90,169,255,.45),inset 0 0 30px rgba(90,169,255,.12);border-color:#5aa9ff}50%{box-shadow:0 0 60px rgba(255,77,122,.85),inset 0 0 40px rgba(255,77,122,.25);border-color:#ff4d7a}}
.tz{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.tw{position:absolute;left:0;right:0;top:70px;display:flex;justify-content:center}
.toast{padding:8px 20px;border-radius:999px;font-weight:800;font-size:clamp(14px,2vw,20px);background:rgba(15,9,34,.92);border:1px solid rgba(255,255,255,.25);animation:toast 1.7s ease forwards;white-space:nowrap}
.toast.good{border-color:#5be39a;color:#c9ffe1}
.toast.bad{border-color:#ff4d7a;color:#ffd1e0}
.toast.info{border-color:#5ab4ff}
@keyframes toast{0%{opacity:0;transform:translateY(-8px) scale(.9)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.pt{position:absolute;left:50%;top:50%;font-size:22px;animation:pt .95s ease-out forwards}
@keyframes pt{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.cam.active,.buzz.ready,.tm.low b,.tm.wait i,dialog.low,.pt{animation:none}}
.aud{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 auto 14px}
.eq{display:flex;align-items:flex-end;gap:6px;height:46px}
.eq i{display:block;width:8px;height:12px;border-radius:4px;background:rgba(255,255,255,.35);transition:background .2s}
.aud.on .eq i{background:#5ab4ff;animation:eqb .8s ease-in-out infinite}
.aud.on .eq i:nth-child(2){animation-delay:.12s}.aud.on .eq i:nth-child(3){animation-delay:.24s}.aud.on .eq i:nth-child(4){animation-delay:.36s}.aud.on .eq i:nth-child(5){animation-delay:.48s}
@keyframes eqb{0%,100%{height:10px}50%{height:44px}}
@media (prefers-reduced-motion:reduce){.aud.on .eq i{animation:none;height:30px}}
</style>

  S.used=PTS.map(function(){return five(function(){return[0,0,0,0]})});
  S.round=0;S.open=null;S.announce=null;S.buzzed=false;S.cur=1;
  S.players.forEach(function(p,i){p.score=0;if(i)p.name="Spieler "+i});
  ws.send(JSON.stringify({t:"reset"}));commit();
};
$("rBtn").onclick=function(){S.round=(S.round+1)%PTS.length;commit()};
$("resetBtn").onclick=function(){S.used=PTS.map(function(){return five(function(){return[0,0,0,0]})});S.round=0;S.open=null;S.announce=null;S.buzzed=false;commit()};
render();
var P=new URLSearchParams(location.search);
function connect(msg){
  kicked=false;
  if(ws)try{ws.close()}catch(x){}
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
  ws.onopen=function(){ws.send(JSON.stringify(msg));setInterval(function(){if(ws&&ws.readyState===1)ws.send('{"t":"ping"}')},30000)};
  ws.onmessage=function(e){
    var m=JSON.parse(e.data);
    if(m.t==="kickok"){clearTimeout(kickT);return}
    if(m.t==="err"){clearTimeout(kickT);alert(m.msg);return}
    if(m.t==="kicked"){kicked=true;myslot=0;$("join").style.display="flex";$("lobbyinfo").textContent="Vom Moderator entfernt";render();alert(m.closed?"Der Moderator hat eine neue Lobby geöffnet. Bitte mit dem neuen Code beitreten.":"Du wurdest vom Moderator aus der Lobby entfernt.");return}
    if(m.t==="hosted"){code=m.code;try{localStorage.setItem("gs3host",JSON.stringify({code:m.code,token:m.token}))}catch(x){}host=true;$("lobbyinfo").innerHTML='Lobby-Code: <b>'+m.code+'</b> <button id="cpBtn">Link kopieren</button>';
      $("cpBtn").onclick=function(){var l=location.origin+"/?c="+m.code,btn=this;function ok(){btn.textContent="Kopiert ✓";setTimeout(function(){btn.textContent="Link kopieren"},1500)}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(l).then(ok,function(){prompt("Link:",l)});else prompt("Link:",l)};push();render()}
    if(m.t==="joined"){myslot=m.slot;$("join").style.display="none";$("lobbyinfo").textContent="Lobby "+m.code+(m.slot?" · du bist Spieler "+m.slot:" · Zuschauer");render()}
    if(m.t==="state"){if(m.S.buzzed&&!S.buzzed)beep();S=m.S;if(host){try{localStorage.setItem(LK+"s",JSON.stringify(S))}catch(x){}}render()}
  };
  ws.onclose=function(){if(!kicked)$("lobbyinfo").textContent="Verbindung weg – Seite neu laden"};
}
if(P.has("host")){
  $("join").style.display="none";
  var sv={};try{sv=JSON.parse(localStorage.getItem("gs3host"))||{}}catch(x){}
  connect({t:"host",code:sv.code,token:sv.token});
}else{
  $("jc").value=(P.get("c")||"").toUpperCase();
  $("jgo").onclick=function(){connect({t:"join",code:$("jc").value,name:$("jn").value})};
  $("jwatch").onclick=function(){connect({t:"join",code:$("jc").value,name:""})};
}
</script>
