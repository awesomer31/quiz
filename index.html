function beep(){try{var a=new (window.AudioContext||window.webkitAudioContext)(),t=a.currentTime,m=a.createGain();m.gain.value=.5;m.connect(a.destination);[0,.17].forEach(function(d,i){var o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();o.type="sawtooth";o.frequency.setValueAtTime(i?330:420,t+d);o.frequency.exponentialRampToValueAtTime(i?200:260,t+d+.14);f.type="bandpass";f.frequency.setValueAtTime(900,t+d);f.frequency.exponentialRampToValueAtTime(1500,t+d+.1);f.Q.value=4;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(1,t+d+.015);g.gain.exponentialRampToValueAtTime(.01,t+d+.15);o.connect(f);f.connect(g);g.connect(m);o.start(t+d);o.stop(t+d+.16)})}catch(e){}}
function render(){
  var c=ctl(),r=S.round,h="";
  document.body.className=c?"":"aud";
  $("pvBtn").style.display=host?"":"none";
  $("pvBtn").textContent=preview?"Zurück zur Moderator-Ansicht":"Zuschauer-Ansicht ansehen";
  $("rnd").textContent="Runde "+(r+1);
  $("npBtn").textContent="Spieler: "+(S.np||4);
  board.className="board"+(c&&edit?" edit":"");
  S.names[r].forEach(function(n,ci){h+='<div class="cat">'+(c&&edit?'<input data-ci="'+ci+'" value="'+esc(n)+'">':esc(n))+'</div>'});
  PTS[r].forEach(function(p,qi){S.names[r].forEach(function(_,ci){h+='<button class="tile'+(S.used[r][ci][qi]?' used':'')+'" data-ci="'+ci+'" data-qi="'+qi+'"><span>'+p+'</span></button>'})});
  board.innerHTML=h;h="";
  S.players.forEach(function(p,i){
    if(!i||i>(S.np||4))return;
    h+='<div class="cam'+(i===S.cur?' active':'')+'" data-i="'+i+'">'+(i&&c&&edit?'<span class="badge"><input type="number" data-si="'+i+'" value="'+p.score+'"></span>':'')+'<span class="pname">'+(c&&edit?'<input data-pi="'+i+'" value="'+esc(p.name)+'">':esc(p.name)+(i?': '+p.score:''))+'</span></div>';
  });
  camsEl.innerHTML=h;
  var a="";S.players.forEach(function(p,i){if(!i||i>(S.np||4))return;a+='<div class="adj">'+(i?'<button class="turnbtn'+(i===S.cur?' on':'')+'" data-p="'+i+'" data-t="1">Ist dran</button>':'')+(i?[100,50,-50,-100].map(function(v){return'<button data-p="'+i+'" data-v="'+v+'" class="'+(v<0?'neg':'')+'">'+(v>0?'+':'−')+Math.abs(v)+'</button>'}).join(""):'')+'</div>'});
  $("adj").innerHTML=a;
  $("turnPill").textContent=S.players[S.cur].name+"’s Turn";
  buzzBtn.classList.toggle("hit",!!S.buzzed);
  buzzBtn.querySelector("span").textContent=S.buzzed?"GEBUZZERT":"BUZZ";
  buzzBtn.disabled=!(S.open&&!S.buzzed&&!S.open.scored&&(host||myslot>0));
  buzzBtn.style.visibility=(host||myslot>0)?"":"hidden";
  rdlg();
}
function rdlg(){
  if(editing)return;
  var o=S.open,n=S.announce,c=ctl(),h;
  if(!o&&n===null){if(dlg.open)dlg.close();return}
  if(n!==null){
    h='<div class="dh">Alle Fragen durch</div><div class="db"><div class="dq">Runde '+(n+1)+'</div><div class="dans">'+PTS[n].join(" · ")+' Punkte</div>'+(c?'<div class="dbtn"><button class="on" data-act="go">Los geht’s</button></div>':'')+'</div>';
  }else{
    h='<div class="dh">'+esc(o.cat)+' '+o.pts+'</div><div class="db">'+(o.img?'<img class="dimg" src="'+esc(o.img)+'" alt="">':'')+'<div class="dq">'+esc(o.q)+'</div>'+(o.ans?'<div class="dans">'+esc(o.ans)+'</div>':'')+(o.none?'':'<div><span class="dturn">★ '+esc(S.players[S.cur].name)+'’s Turn</span></div>');
    if(c){var d=o.scored?' disabled':'';h+='<div class="dhost">Antwort (nur du): '+esc(Q[S.round][o.ci][o.qi].a)+'</div><div class="dbtn"><button data-act="ok"'+d+'>Richtig +'+Math.round(o.pts/(o.wrong?2:1))+'</button><button data-act="no"'+d+'>Falsch −'+Math.round(o.pts/2)+'</button><button data-act="show">Antwort zeigen</button><button class="on" data-act="fin">Fertig</button></div>'}h+='</div>';
  }
  dlg.innerHTML=h;if(!dlg.open)dlg.showModal();
}
function act(x){
  var o=S.open,r=S.round;
  if(x==="esave"){var g=Q[r][editing.ci][editing.qi];g.q=$("eq").value;g.a=$("ea").value;g.img=$("ei").value.trim();editing=null;commit();return}
  if(x==="ecancel"){editing=null;render();return}
  if(x==="go"){S.round=S.announce;S.announce=null}
  else if(o){
    if(x==="show")o.ans=Q[r][o.ci][o.qi].a;
    if(x==="ok"&&!o.scored){S.players[S.cur].score+=Math.round(o.pts/(o.wrong?2:1));o.scored=1}
    if(x==="no"&&!o.scored){S.players[S.cur].score-=Math.round(o.pts/2);o.wrong=1;o.none=1;S.buzzed=false}
    if(x==="fin"){S.used[r][o.ci][o.qi]=1;S.open=null;S.buzzed=false;S.cur=(o.start||1)%(S.np||4)+1;if(r<PTS.length-1&&S.used[r].every(function(c){return c.every(Boolean)}))S.announce=r+1}
  }
  commit();
}
dlg.addEventListener("click",function(e){var b=e.target.closest("[data-act]");if(b&&ctl())act(b.dataset.act)});
dlg.addEventListener("cancel",function(e){e.preventDefault()});
board.addEventListener("click",function(e){
  var t=e.target.closest(".tile");if(!t||!ctl())return;
  var ci=+t.dataset.ci,qi=+t.dataset.qi,r=S.round,g=Q[r][ci][qi];
  if(edit){
    editing={ci:ci,qi:qi};
    dlg.innerHTML='<div class="db" style="text-align:left"><div class="meta">'+esc(S.names[r][ci])+' · '+PTS[r][qi]+'</div><label>Frage</label><textarea id="eq" rows="3">'+esc(g.q)+'</textarea><label>Antwort</label><textarea id="ea" rows="2">'+esc(g.a)+'</textarea><label>Bild-Link (optional)</label><input id="ei" style="width:100%;box-sizing:border-box" value="'+esc(g.img||"")+'"><div class="row"><button data-act="ecancel">Abbrechen</button><button class="on" data-act="esave">Speichern</button></div></div>';
    dlg.showModal();return;
  }
  if(S.used[r][ci][qi]||S.open||S.announce!==null)return;
  S.open={ci:ci,qi:qi,cat:S.names[r][ci],pts:PTS[r][qi],q:g.q,img:g.img||"",ans:null,scored:0,start:S.cur};commit();
});
board.addEventListener("input",function(e){if(e.target.dataset.ci!==undefined&&ctl()){S.names[S.round][e.target.dataset.ci]=e.target.value;commit(true)}});
camsEl.addEventListener("input",function(e){
  var t=e.target;if(!ctl())return;
  if(t.dataset.pi!==undefined)S.players[t.dataset.pi].name=t.value;
  if(t.dataset.si!==undefined)S.players[t.dataset.si].score=parseInt(t.value,10)||0;
  $("turnPill").textContent=S.players[S.cur].name+"’s Turn";commit(true);
});
camsEl.addEventListener("click",function(e){
  if(e.target.tagName==="INPUT"||!ctl())return;
  var c=e.target.closest(".cam");if(!c||+c.dataset.i===0)return;
  S.cur=+c.dataset.i;if(S.open)S.open.none=0;commit();
});
$("adj").addEventListener("click",function(e){var b=e.target.closest("button");if(!b||!ctl())return;if(b.dataset.t){S.cur=+b.dataset.p;if(S.open)S.open.none=0}else S.players[+b.dataset.p].score+=+b.dataset.v;commit()});
function doBuzz(){
  if(!S.open||S.buzzed||S.open.scored)return;
  if(ctl()){S.buzzed=true;S.open.none=0;beep();commit()}
  else if(myslot>0&&ws&&ws.readyState===1)ws.send(JSON.stringify({t:"buzz"}));
}
buzzBtn.onclick=doBuzz;
document.addEventListener("keydown",function(e){
  if(e.code!=="Space"||ctl()||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  e.preventDefault();if(!e.repeat)doBuzz();
});
document.addEventListener("keyup",function(e){if(e.code==="Space"&&!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault()});
document.addEventListener("keydown",function(e){
  if(e.code!=="Enter"||e.repeat||!ctl()||editing||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(S.open){e.preventDefault();act(S.open.ans?"fin":"show")}else if(S.announce!==null){e.preventDefault();act("go")}
});
$("pvBtn").onclick=function(){preview=!preview;try{sessionStorage.setItem("gs3pv",preview?"1":"0")}catch(e){}render()};
$("editBtn").onclick=function(){edit=!edit;this.classList.toggle("on",edit);this.textContent=edit?"Fertig bearbeitet":"Bearbeiten";render()};
$("npBtn").onclick=function(){var n=S.np||4;S.np=n===4?3:n===3?2:4;if(S.cur>S.np)S.cur=1;commit()};
$("rBtn").onclick=function(){S.round=(S.round+1)%PTS.length;commit()};
$("resetBtn").onclick=function(){S.used=PTS.map(function(){return five(function(){return[0,0,0,0]})});S.round=0;S.open=null;S.announce=null;S.buzzed=false;commit()};
render();
var P=new URLSearchParams(location.search);
function connect(msg){
  if(ws)try{ws.close()}catch(x){}
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
  ws.onopen=function(){ws.send(JSON.stringify(msg));setInterval(function(){if(ws&&ws.readyState===1)ws.send('{"t":"ping"}')},30000)};
  ws.onmessage=function(e){
    var m=JSON.parse(e.data);
    if(m.t==="err"){alert(m.msg);return}
    if(m.t==="hosted"){code=m.code;try{localStorage.setItem("gs3host",JSON.stringify({code:m.code,token:m.token}))}catch(x){}host=true;$("lobbyinfo").innerHTML='Lobby-Code: <b>'+m.code+'</b> <button id="cpBtn">Link kopieren</button>';
      $("cpBtn").onclick=function(){var l=location.origin+"/?c="+m.code,btn=this;function ok(){btn.textContent="Kopiert ✓";setTimeout(function(){btn.textContent="Link kopieren"},1500)}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(l).then(ok,function(){prompt("Link:",l)});else prompt("Link:",l)};push();render()}
    if(m.t==="joined"){myslot=m.slot;$("join").style.display="none";$("lobbyinfo").textContent="Lobby "+m.code+(m.slot?" · du bist Spieler "+m.slot:" · Zuschauer");render()}
    if(m.t==="state"){if(m.S.buzzed&&!S.buzzed)beep();S=m.S;if(host){try{localStorage.setItem(LK+"s",JSON.stringify(S))}catch(x){}}render()}
  };
  ws.onclose=function(){$("lobbyinfo").textContent="Verbindung weg – Seite neu laden"};
}
if(P.has("host")){
  $("join").style.display="none";
  var sv={};try{sv=JSON.parse(localStorage.getItem("gs3host"))||{}}catch(x){}
  connect({t:"host",code:sv.code,token:sv.token});
}else{
  $("jc").value=(P.get("c")||"").toUpperCase();
  $("jgo").onclick=function(){connect({t:"join",code:$("jc").value,name:$("jn").value})};
  $("jwatch").onclick=function(){connect({t:"join",code:$("jc").value,name:""})};
}
</script>
