<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Show</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#efe9fa;--cat:#4a1f8f;--cat-t:#fff;--tile:#6a2fd0;--tile-t:#fff;--used:#d6cdea;--used-t:#9a8fb8;--card:#fff;--text:#2a1450;--line:#cfc2ea;--accent:#c2185b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140a2e;--cat:#3b1a7a;--cat-t:#fff;--tile:#5a24b8;--tile-t:#fff;--used:#241547;--used-t:#5d4c8a;--card:#1e1040;--text:#f1eaff;--line:#43297f;--accent:#ff4d7a}}
:root[data-theme="dark"]{--bg:#140a2e;--cat:#3b1a7a;--cat-t:#fff;--tile:#5a24b8;--tile-t:#fff;--used:#241547;--used-t:#5d4c8a;--card:#1e1040;--text:#f1eaff;--line:#43297f;--accent:#ff4d7a}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{margin:0;font-size:clamp(20px,3vw,32px);letter-spacing:.04em;text-transform:uppercase}
.btns{display:flex;gap:8px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:8px 14px}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cat{background:linear-gradient(160deg,var(--cat),#1f2a7a);color:var(--cat-t);border-radius:8px;padding:14px 6px;text-align:center;font-weight:700;font-size:clamp(13px,2vw,24px);min-height:48px;display:flex;align-items:center;justify-content:center;text-transform:uppercase;overflow-wrap:anywhere}
.cat input{width:100%;font:inherit;font-weight:700;text-align:center;background:transparent;color:inherit;border:1px dashed var(--cat-t);border-radius:6px;padding:6px;text-transform:uppercase}
.tile{background:var(--tile);color:var(--tile-t);font-weight:800;font-size:clamp(16px,3.2vw,38px);border:0;border-radius:8px;aspect-ratio:16/6;padding:0}
.tile:hover{filter:brightness(1.15)}
.tile.used{background:var(--used);color:var(--used-t);cursor:default;filter:none}
.tile.used span{visibility:hidden}
.edit .tile.used{background:var(--tile);color:var(--tile-t);cursor:pointer}
.edit .tile.used span{visibility:visible}
.cams{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}
.cam{aspect-ratio:1/1;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:clamp(11px,1.6vw,18px);opacity:.75;background:linear-gradient(160deg,rgba(106,47,208,.18),rgba(194,24,91,.12))}
.tile{box-shadow:0 0 14px rgba(106,47,208,.55)}
.tile.used{box-shadow:none}
.edit .tile.used{box-shadow:0 0 14px rgba(106,47,208,.55)}
.pill{background:linear-gradient(90deg,var(--accent),var(--tile));color:#fff;font-weight:800;border-radius:999px;padding:10px 22px;text-transform:uppercase;letter-spacing:.04em;box-shadow:0 0 16px rgba(194,24,91,.45)}
.pill::before{content:"\2605  "}.pill::after{content:"  \2605"}
.buzzwrap{display:flex;justify-content:center;margin-top:14px}
.buzz{width:120px;height:120px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;letter-spacing:.06em;font-size:14px;background:var(--card);color:var(--text);border:2px solid var(--line)}
.buzz.hit{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 28px var(--accent)}
.cam{position:relative;cursor:pointer;overflow:hidden}
.cam.active{border-style:solid;border-color:var(--accent);opacity:1;box-shadow:0 0 18px var(--accent)}
.badge{position:absolute;top:6px;left:6px;background:var(--tile);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800}
.badge.neg{background:#c2185b}
.badge input{width:70px;font:inherit;background:transparent;color:#fff;border:0;border-bottom:1px dashed #fff}
.pname{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:86%;box-sizing:border-box;background:var(--cat);color:#fff;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.pname input{width:100%;font:inherit;text-transform:uppercase;background:transparent;color:#fff;border:0;text-align:center}
dialog{border:0;border-radius:14px;background:var(--card);color:var(--text);width:min(760px,92vw);padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.meta{color:var(--accent);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.q{font-size:clamp(20px,4vw,34px);font-weight:700;margin:14px 0;min-height:60px}
.a{font-size:clamp(18px,3.4vw,28px);color:var(--accent);font-weight:700;margin:10px 0;min-height:36px}
textarea{width:100%;box-sizing:border-box;font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;margin:4px 0 12px}
label{font-size:13px;opacity:.8}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
dialog{background:linear-gradient(180deg,#3b1a7a,#1c2468);color:#fff;border:1px solid #5aa9ff;border-radius:12px;padding:0;width:min(1000px,94vw);box-shadow:0 0 40px rgba(90,169,255,.45),inset 0 0 30px rgba(90,169,255,.12)}
.dh{padding:16px;text-align:center;font-weight:800;font-size:clamp(16px,2.4vw,26px);color:#5ab4ff;text-transform:uppercase;border-bottom:1px solid rgba(90,169,255,.35);text-shadow:0 0 12px rgba(90,169,255,.6)}
.db{padding:26px 24px}
.dq{text-align:center;font-weight:800;font-size:clamp(22px,3.8vw,44px);text-transform:uppercase;line-height:1.2}
.dans{text-align:center;margin-top:18px;font-weight:800;font-size:clamp(20px,3.4vw,38px);text-transform:uppercase;color:#ffd1e6;text-shadow:0 0 16px var(--accent);animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.db>div:has(.dturn){text-align:center}
.dturn{display:inline-block;margin-top:18px;padding:6px 16px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(90,169,255,.3);font-size:15px;text-transform:uppercase}
.dhost{text-align:center;margin-top:14px;font-size:14px;opacity:.65}
.dbtn{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.tile{font-style:italic}
.pname{background:linear-gradient(180deg,#c2185b,#7a0f3a)}
.cam.active .pname{box-shadow:0 0 12px var(--accent)}
.adj{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.adj button{padding:8px 0;font-weight:800;font-size:14px}
.adj button.neg{color:#ff6b8f}
#adj{margin-bottom:-6px}
body.aud #adj{display:none}
.buzz:disabled{opacity:.4;cursor:default}
.adj .turnbtn{grid-column:1/-1}
.adj .turnbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cams{grid-template-columns:repeat(4,minmax(0,1fr))}
.cam{aspect-ratio:auto;height:84px;border:2px solid var(--line);opacity:1}
.pname{top:50%;bottom:auto;transform:translate(-50%,-50%);font-size:clamp(14px,2vw,22px);padding:8px 12px}
body.aud .hostonly{display:none}
body.aud .tile,body.aud .cam,body.aud .buzz{cursor:default}
#join{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50}
.jbox{display:flex;flex-direction:column;gap:10px;width:min(340px,90vw);background:var(--card);padding:24px;border-radius:14px;border:1px solid var(--line)}
.jbox input{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);text-transform:uppercase}
.jbox h2{margin:0}
</style>
</head>
<body>
<header>
  <h1>Game Show · <span id="rnd"></span></h1>
  <div class="pill" id="turnPill"></div>
  <div id="lobbyinfo" style="font-weight:700;font-size:14px"></div>
  <div class="btns"><button id="pvBtn" style="display:none"></button><span class="hostonly btns"><button id="editBtn">Bearbeiten</button><button id="rBtn">Runde wechseln</button><button id="resetBtn">Felder zurücksetzen</button></span></div>
</header>
<main id="board" class="board"></main>
<section class="buzzwrap"><button id="buzz" class="buzz"><b style="font-size:38px;line-height:1">🦆</b><span>BUZZ</span></button></section>
<section class="cams" id="adj"></section>
<section class="cams" id="cams"></section>
<dialog id="dlg"></dialog>
<div id="join"><div class="jbox"><h2>Quiz beitreten</h2><input id="jc" placeholder="Lobby-Code" maxlength="4"><input id="jn" placeholder="Dein Name" maxlength="14"><button id="jgo" class="on">Beitreten</button><button id="jwatch">Nur zuschauen</button></div></div>
<script>
var PTS=[[100,200,300,500],[200,400,600,1000]],LK="gs3",host=false,preview=false,edit=false,db=null,ref=null,ws=null,myslot=0,code="",editing=null,tm,Q,S;
function $(i){return document.getElementById(i)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function five(f){return[0,1,2,3,4].map(f)}
function blankQ(){return PTS.map(function(p){return five(function(){return p.map(function(x){return{q:"Hier steht die Frage für "+x+" Punkte",a:"Antwort"}})})})}
function blankS(){return{round:0,used:PTS.map(function(){return five(function(){return[0,0,0,0]})}),names:PTS.map(function(_,r){return five(function(i){return"Kategorie "+(r*5+i+1)})}),players:[{name:"Moderator",score:0}].concat([1,2,3,4].map(function(i){return{name:"Spieler "+i,score:0}})),cur:1,buzzed:false,open:null,announce:null}}
try{Q=JSON.parse(localStorage.getItem(LK+"q"))||blankQ();S=JSON.parse(localStorage.getItem(LK+"s"))||blankS()}catch(e){Q=blankQ();S=blankS()}
var board=$("board"),dlg=$("dlg"),camsEl=$("cams"),buzzBtn=$("buzz");
function ctl(){return host&&!preview}
function push(){if(host&&ws&&ws.readyState===1)ws.send(JSON.stringify({t:"state",S:S}))}
function commit(nr){try{localStorage.setItem(LK+"q",JSON.stringify(Q));localStorage.setItem(LK+"s",JSON.stringify(S))}catch(e){}if(!nr)render();clearTimeout(tm);tm=setTimeout(push,150)}
function beep(){try{var a=new (window.AudioContext||window.webkitAudioContext)(),t=a.currentTime,m=a.createGain();m.gain.value=.5;m.connect(a.destination);[0,.17].forEach(function(d,i){var o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();o.type="sawtooth";o.frequency.setValueAtTime(i?330:420,t+d);o.frequency.exponentialRampToValueAtTime(i?200:260,t+d+.14);f.type="bandpass";f.frequency.setValueAtTime(900,t+d);f.frequency.exponentialRampToValueAtTime(1500,t+d+.1);f.Q.value=4;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(1,t+d+.015);g.gain.exponentialRampToValueAtTime(.01,t+d+.15);o.connect(f);f.connect(g);g.connect(m);o.start(t+d);o.stop(t+d+.16)})}catch(e){}}
function render(){
  var c=ctl(),r=S.round,h="";
  document.body.className=c?"":"aud";
  $("pvBtn").style.display=host?"":"none";
  $("pvBtn").textContent=preview?"Zurück zur Moderator-Ansicht":"Zuschauer-Ansicht ansehen";
  $("rnd").textContent="Runde "+(r+1);
  board.className="board"+(c&&edit?" edit":"");
  S.names[r].forEach(function(n,ci){h+='<div class="cat">'+(c&&edit?'<input data-ci="'+ci+'" value="'+esc(n)+'">':esc(n))+'</div>'});
  PTS[r].forEach(function(p,qi){S.names[r].forEach(function(_,ci){h+='<button class="tile'+(S.used[r][ci][qi]?' used':'')+'" data-ci="'+ci+'" data-qi="'+qi+'"><span>'+p+'</span></button>'})});
  board.innerHTML=h;h="";
  S.players.forEach(function(p,i){
    if(!i)return;
    h+='<div class="cam'+(i===S.cur?' active':'')+'" data-i="'+i+'">'+(i&&c&&edit?'<span class="badge"><input type="number" data-si="'+i+'" value="'+p.score+'"></span>':'')+'<span class="pname">'+(c&&edit?'<input data-pi="'+i+'" value="'+esc(p.name)+'">':esc(p.name)+(i?': '+p.score:''))+'</span></div>';
  });
  camsEl.innerHTML=h;
  var a="";S.players.forEach(function(p,i){if(!i)return;a+='<div class="adj">'+(i?'<button class="turnbtn'+(i===S.cur?' on':'')+'" data-p="'+i+'" data-t="1">Ist dran</button>':'')+(i?[100,50,-50,-100].map(function(v){return'<button data-p="'+i+'" data-v="'+v+'" class="'+(v<0?'neg':'')+'">'+(v>0?'+':'−')+Math.abs(v)+'</button>'}).join(""):'')+'</div>'});
  $("adj").innerHTML=a;
  $("turnPill").textContent=S.players[S.cur].name+"’s Turn";
  buzzBtn.classList.toggle("hit",!!S.buzzed);
  buzzBtn.querySelector("span").textContent=S.buzzed?"GEBUZZERT":"BUZZ";
  buzzBtn.disabled=!(S.open&&!S.buzzed&&!S.open.scored&&(host||myslot>0));
  buzzBtn.style.visibility=(host||myslot>0)?"":"hidden";
  rdlg();
}
function rdlg(){
  if(editing)return;
  var o=S.open,n=S.announce,c=ctl(),h;
  if(!o&&n===null){if(dlg.open)dlg.close();return}
  if(n!==null){
    h='<div class="dh">Alle Fragen durch</div><div class="db"><div class="dq">Runde '+(n+1)+'</div><div class="dans">'+PTS[n].join(" · ")+' Punkte</div>'+(c?'<div class="dbtn"><button class="on" data-act="go">Los geht’s</button></div>':'')+'</div>';
  }else{
    h='<div class="dh">'+esc(o.cat)+' '+o.pts+'</div><div class="db"><div class="dq">'+esc(o.q)+'</div>'+(o.ans?'<div class="dans">'+esc(o.ans)+'</div>':'')+(o.none?'':'<div><span class="dturn">★ '+esc(S.players[S.cur].name)+'’s Turn</span></div>');
    if(c){var d=o.scored?' disabled':'';h+='<div class="dhost">Antwort (nur du): '+esc(Q[S.round][o.ci][o.qi].a)+'</div><div class="dbtn"><button data-act="ok"'+d+'>Richtig +'+Math.round(o.pts/(o.wrong?2:1))+'</button><button data-act="no"'+d+'>Falsch −'+Math.round(o.pts/2)+'</button><button data-act="show">Antwort zeigen</button><button class="on" data-act="fin">Fertig</button></div>'}h+='</div>';
  }
  dlg.innerHTML=h;if(!dlg.open)dlg.showModal();
}
function act(x){
  var o=S.open,r=S.round;
  if(x==="esave"){var g=Q[r][editing.ci][editing.qi];g.q=$("eq").value;g.a=$("ea").value;editing=null;commit();return}
  if(x==="ecancel"){editing=null;render();return}
  if(x==="go"){S.round=S.announce;S.announce=null}
  else if(o){
    if(x==="show")o.ans=Q[r][o.ci][o.qi].a;
    if(x==="ok"&&!o.scored){S.players[S.cur].score+=Math.round(o.pts/(o.wrong?2:1));o.scored=1}
    if(x==="no"&&!o.scored){S.players[S.cur].score-=Math.round(o.pts/2);o.wrong=1;o.none=1;S.buzzed=false}
    if(x==="fin"){S.used[r][o.ci][o.qi]=1;S.open=null;S.buzzed=false;S.cur=(o.start||1)%4+1;if(r<PTS.length-1&&S.used[r].every(function(c){return c.every(Boolean)}))S.announce=r+1}
  }
  commit();
}
dlg.addEventListener("click",function(e){var b=e.target.closest("[data-act]");if(b&&ctl())act(b.dataset.act)});
dlg.addEventListener("cancel",function(e){e.preventDefault()});
board.addEventListener("click",function(e){
  var t=e.target.closest(".tile");if(!t||!ctl())return;
  var ci=+t.dataset.ci,qi=+t.dataset.qi,r=S.round,g=Q[r][ci][qi];
  if(edit){
    editing={ci:ci,qi:qi};
    dlg.innerHTML='<div class="db" style="text-align:left"><div class="meta">'+esc(S.names[r][ci])+' · '+PTS[r][qi]+'</div><label>Frage</label><textarea id="eq" rows="3">'+esc(g.q)+'</textarea><label>Antwort</label><textarea id="ea" rows="2">'+esc(g.a)+'</textarea><div class="row"><button data-act="ecancel">Abbrechen</button><button class="on" data-act="esave">Speichern</button></div></div>';
    dlg.showModal();return;
  }
  if(S.used[r][ci][qi]||S.open||S.announce!==null)return;
  S.open={ci:ci,qi:qi,cat:S.names[r][ci],pts:PTS[r][qi],q:g.q,ans:null,scored:0,start:S.cur};commit();
});
board.addEventListener("input",function(e){if(e.target.dataset.ci!==undefined&&ctl()){S.names[S.round][e.target.dataset.ci]=e.target.value;commit(true)}});
camsEl.addEventListener("input",function(e){
  var t=e.target;if(!ctl())return;
  if(t.dataset.pi!==undefined)S.players[t.dataset.pi].name=t.value;
  if(t.dataset.si!==undefined)S.players[t.dataset.si].score=parseInt(t.value,10)||0;
  $("turnPill").textContent=S.players[S.cur].name+"’s Turn";commit(true);
});
camsEl.addEventListener("click",function(e){
  if(e.target.tagName==="INPUT"||!ctl())return;
  var c=e.target.closest(".cam");if(!c||+c.dataset.i===0)return;
  S.cur=+c.dataset.i;if(S.open)S.open.none=0;commit();
});
$("adj").addEventListener("click",function(e){var b=e.target.closest("button");if(!b||!ctl())return;if(b.dataset.t){S.cur=+b.dataset.p;if(S.open)S.open.none=0}else S.players[+b.dataset.p].score+=+b.dataset.v;commit()});
function doBuzz(){
  if(!S.open||S.buzzed||S.open.scored)return;
  if(ctl()){S.buzzed=true;S.open.none=0;beep();commit()}
  else if(myslot>0&&ws&&ws.readyState===1)ws.send(JSON.stringify({t:"buzz"}));
}
buzzBtn.onclick=doBuzz;
document.addEventListener("keydown",function(e){
  if(e.code!=="Space"||ctl()||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  e.preventDefault();if(!e.repeat)doBuzz();
});
document.addEventListener("keyup",function(e){if(e.code==="Space"&&!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault()});
document.addEventListener("keydown",function(e){
  if(e.code!=="Enter"||e.repeat||!ctl()||editing||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(S.open){e.preventDefault();act(S.open.ans?"fin":"show")}else if(S.announce!==null){e.preventDefault();act("go")}
});
$("pvBtn").onclick=function(){preview=!preview;try{sessionStorage.setItem("gs3pv",preview?"1":"0")}catch(e){}render()};
$("editBtn").onclick=function(){edit=!edit;this.classList.toggle("on",edit);this.textContent=edit?"Fertig bearbeitet":"Bearbeiten";render()};
$("rBtn").onclick=function(){S.round=(S.round+1)%PTS.length;commit()};
$("resetBtn").onclick=function(){S.used=PTS.map(function(){return five(function(){return[0,0,0,0]})});S.round=0;S.open=null;S.announce=null;S.buzzed=false;commit()};
render();
var P=new URLSearchParams(location.search);
function connect(msg){
  if(ws)try{ws.close()}catch(x){}
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
  ws.onopen=function(){ws.send(JSON.stringify(msg));setInterval(function(){if(ws&&ws.readyState===1)ws.send('{"t":"ping"}')},30000)};
  ws.onmessage=function(e){
    var m=JSON.parse(e.data);
    if(m.t==="err"){alert(m.msg);return}
    if(m.t==="hosted"){code=m.code;try{localStorage.setItem("gs3host",JSON.stringify({code:m.code,token:m.token}))}catch(x){}host=true;$("lobbyinfo").textContent="Lobby-Code: "+m.code+" · Link für Freunde: "+location.origin+"/?c="+m.code;push();render()}
    if(m.t==="joined"){myslot=m.slot;$("join").style.display="none";$("lobbyinfo").textContent="Lobby "+m.code+(m.slot?" · du bist Spieler "+m.slot:" · Zuschauer");render()}
    if(m.t==="state"){if(m.S.buzzed&&!S.buzzed)beep();S=m.S;if(host){try{localStorage.setItem(LK+"s",JSON.stringify(S))}catch(x){}}render()}
  };
  ws.onclose=function(){$("lobbyinfo").textContent="Verbindung weg – Seite neu laden"};
}
if(P.has("host")){
  $("join").style.display="none";
  var sv={};try{sv=JSON.parse(localStorage.getItem("gs3host"))||{}}catch(x){}
  connect({t:"host",code:sv.code,token:sv.token});
}else{
  $("jc").value=(P.get("c")||"").toUpperCase();
  $("jgo").onclick=function(){connect({t:"join",code:$("jc").value,name:$("jn").value})};
  $("jwatch").onclick=function(){connect({t:"join",code:$("jc").value,name:""})};
}
</script>

</body>
</html>
